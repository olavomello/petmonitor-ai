# Ultralytics YOLO dataset configuration — PetMonitor AI custom pet classes
# path is relative to this file; images/labels are git-ignored (see .gitignore)
# See docs/guides/mlops.md for labeling instructions.

path: ../datasets       # project root → datasets/
train: images/train
val:   images/val
test:  images/test      # optional held-out set for final evaluation

nc: 2
names:
  0: Branca
  1: Marrie

# --- labeling notes ---
# bbox format: YOLO (cx cy w h), all values normalized 0–1
# tool: LabelImg (YOLO format), Roboflow, or CVAT
# minimum recommended images: 200 per class, 80/20 train/val split
# augmentation: handled by Ultralytics during training (hsv, flipud, fliplr, mosaic)

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "petmonitor-ai"
version = "0.0.1"
description = "Privacy-first local pet activity monitoring via computer vision"
requires-python = ">=3.11"
dependencies = [
    # Camera integration
    "blinkpy>=0.22.0",
    # Computer vision
    "opencv-python-headless>=4.8.0",
    # Object detection (CPU-only; pin minor to control model downloads)
    "ultralytics>=8.1.0,<8.4",
    # Configuration
    "pyyaml>=6.0",
    # Environment variables
    "python-dotenv>=1.0",
    # Async HTTP (blinkpy dependency, explicit pin)
    "aiohttp>=3.9.0",
    # API (approved 2026-11-16)
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.4.0",
]

[project.scripts]
petmonitor-blink = "petmonitor.blink.cli:main"
petmonitor-ingest = "petmonitor.ingestion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=petmonitor --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
